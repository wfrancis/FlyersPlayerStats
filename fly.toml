# Fly.io config — one small machine + one volume holding the SQLite file.
app = "flyers-12u-green"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/stats.db"
  TEAM_NAME = "12U A Green"

# SQLite lives on this volume. Only ever run ONE machine (volumes aren't shared).
[mounts]
  source = "stats_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
