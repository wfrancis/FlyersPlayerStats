<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0ca64f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Team Stats">
  <meta name="format-detection" content="telephone=no">
  <title>Team Stats</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <svg class="brand-puck" viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="19" rx="13" ry="6" fill="#0b1b2b"/><rect x="3" y="13" width="26" height="6" fill="#0b1b2b"/><ellipse cx="16" cy="13" rx="13" ry="6" fill="#23384d"/></svg>
      <span id="team-name">Team Stats</span>
    </a>
  </header>

  <main id="app" tabindex="-1"><div class="loading">Loading…</div></main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/" data-tab="games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Games</span>
    </a>
    <a href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11h3v9zm5.5 0V4h3v16zM16 20v-6h3v6z"/></svg>
      <span>Stats</span>
    </a>
    <a href="#/roster" data-tab="roster">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.5 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2.5 19c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6v1h-13zm14.5 1v-1c0-1.9-.7-3.6-1.9-4.9.4-.1.9-.1 1.4-.1 3 0 5.5 2.2 5.5 5v1z"/></svg>
      <span>Roster</span>
    </a>
  </nav>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
